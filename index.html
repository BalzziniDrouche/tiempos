ze: 18px;line-height: 1.2;overflow-wrap: anywhere;}.tru{color: var(--muted);font-size: 14px;}.tex{font-family: var(--font-head);font-weight: 600;font-size: 14px;color: var(--g);margin-top: 2px;overflow-wrap: anywhere;}.tstars{display: flex;gap: 2px;margin-top: 4px;}.tstars i{width: 18px;height: 18px;display: block;}.tstars svg{width: 100%;height: 100%;fill: none;stroke: var(--line);stroke-width: 1.6;stroke-linejoin: round;}.tstars i.on svg{fill: var(--g-imp);stroke: var(--g-imp);}.tdue{position: absolute;top: 6px;left: 52px;min-width: 24px;height: 24px;padding: 0 7px;display: grid;place-items: center;border-radius: 12px;background: var(--g-past);color: #fff;font-weight: 700;font-size: 13px;}.tcard.locked{cursor: default;box-shadow: none;background: transparent;border: 1.5px dashed var(--line);opacity: .8;}.tcard.locked::before{background: var(--line);}.tcard.locked:hover,.tcard.locked:active{transform: none;box-shadow: none;}.tcard.locked .tname,.tcard.locked .tex{color: var(--muted);}.tcard.locked .tring{--g: var(--muted);}.ribbon{position: absolute;bottom: 8px;right: 10px;font-size: 11px;font-weight: 700;letter-spacing: .08em;text-transform: uppercase;color: var(--muted);border: 1px solid var(--line);border-radius: 999px;padding: 1px 8px;}.hubfoot{text-align: center;margin: 8px 0 0;}.stat.xp b{color: var(--g-fut);}body.hubmode{padding-bottom: 40px;}@media (max-width: 640px){.gamebar{grid-template-columns: 1fr 1fr;}.gcell.lvl{grid-column: 1 / -1;}.brand h1{font-size: 34px;}.hero b{font-size: 21px;}}@media (prefers-reduced-motion: no-preference){.ring .rf{transition: stroke-dasharray .6s ease;}.tdue{animation: pop 1.8s ease-in-out infinite;}@keyframes pop{0%,100%{transform: scale(1);}50%{transform: scale(1.12);}}}</style></head><body><div class="wrap"> <header id="head"></header> <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav> <main id="view"></main> </div> <div id="toastHost" aria-live="polite"></div> <div class="insbar" id="insbar" aria-label="Спецсимволы"></div> <div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"> <div class="phead"><h2 id="sheetTitle"></h2><button type="button" class="btn sm" data-act="close-sheet">Закрыть</button></div> <div id="sheetBody"></div></div></div> <template id="tpl-imperativo"> <details data-sec="formula"><summary>Обзор: четыре лица и две формулы</summary> <p>Императив – просьба, приказ или совет. Основа – <b>четыре лица</b>: <b>tú</b>, <b>usted</b>, <b>vosotros</b>, <b>ustedes</b>. Для yo и él/ella/ellos форм нет.</p> <p class="key">Главное: почти все формы берутся из <b>Presente de subjuntivo</b>. Исключений два: <b>tú (+)</b> и <b>vosotros (+)</b>. Отрицание всегда строится как <b>no + subjuntivo</b>.</p> <div class="tblwrap"><table class="tbl"> <thead><tr><th>Лицо</th><th>Утвердительный (+)</th><th>Отрицательный (–)</th></tr></thead> <tbody> <tr><td>tú</td><td>как <b>él</b> в Presente: <span class="ex">habla</span></td><td>no + subj.: <span class="ex">no hables</span></td></tr> <tr><td>usted</td><td>subjuntivo: <span class="ex">hable</span></td><td><span class="ex">no hable</span></td></tr> <tr><td>vosotros</td><td>инфинитив, -r → -d: <span class="ex">hablad</span></td><td><span class="ex">no habléis</span></td></tr> <tr><td>ustedes</td><td>subjuntivo: <span class="ex">hablen</span></td><td><span class="ex">no hablen</span></td></tr> </tbody></table></div> <p><b>Где что используется.</b> Испания: tú, usted, vosotros, ustedes. Мексика и большая часть Латинской Америки: tú, usted, ustedes (вместо vosotros говорят ustedes). Если ты учишь мексиканский вариант, отключи vosotros в настройках тренировки.</p> <p class="small muted">Отдельно вынесены формы, которых нет в основе: <b>nosotros</b> («давайте…») и <b>vos</b> (Аргентина и др.). Их можно включать и отключать в тренировке, а теория по ним собрана в группе «Дополнительно».</p> <p class="small muted">Цвет: <span class="end"><b>окончание</b></span> – то, что меняется; <span class="irr">неправильная форма</span>; <span class="st">подчёркнутая</span> гласная – ударение, которое сдвигается при присоединении местоимений.</p> <div class="mt-row"> <div class="mt" data-conj="hablar"></div><div class="mt" data-conj="comer"></div><div class="mt" data-conj="vivir"></div> </div> </details> <details data-sec="subj"><summary>Presente de subjuntivo: как получить</summary> <p><b>Алгоритм:</b> 1) возьми форму <b>yo</b> в Presente → 2) отбрось <b>-o</b> → 3) добавь «противоположную» гласную: у <b>-ar</b> это <b>e</b>, у <b>-er / -ir</b> это <b>a</b>.</p> <p><span class="ex">hablo → habl- → hable</span> &nbsp; <span class="ex">como → com- → coma</span> &nbsp; <span class="ex">vivo → viv- → viva</span></p> <div class="tblwrap"><table class="tbl"> <thead><tr><th></th><th>-ar</th><th>-er / -ir</th></tr></thead> <tbody> <tr><td>tú</td><td class="ex end">-es</td><td class="ex end">-as</td></tr> <tr><td>usted</td><td class="ex end">-e</td><td class="ex end">-a</td></tr> <tr><td>vosotros</td><td class="ex end">-éis</td><td class="ex end">-áis</td></tr> <tr><td>ustedes</td><td class="ex end">-en</td><td class="ex end">-an</td></tr> <tr><td>nosotros</td><td class="ex end">-emos</td><td class="ex end">-amos</td></tr> </tbody></table></div> <p class="small muted">В императиве эти окончания нужны для usted, ustedes и для всех отрицательных форм: tú (–), vosotros (–). Строка nosotros нужна для отдельной темы «Nosotros».</p> <p class="warn">Если форма <b>yo</b> неправильная, основа берётся из неё: tengo → <b>tenga</b>. Подробности в теме «Неправильная форма yo».</p> </details> <details data-sec="tu"><summary>Tú: правило и 8 исключений</summary> <p><b>Tú (+)</b> у правильных глаголов совпадает с формой <b>él/ella</b> в Presente: <span class="ex">habla, come, escribe</span>. Чередование корня сохраняется: <span class="ex">duerme, piensa, pide, vuelve</span>.</p> <p><b>Tú (–)</b> – обычный subjuntivo: <span class="ex">no hables, no comas, no escribas</span>.</p> <p>Восемь глаголов имеют особую короткую форму в утвердительном императиве. В отрицании у них всё по общему правилу:</p> <div data-tu8></div> <p>Производные повторяют форму основы: <span class="ex">componer → compón</span>, <span class="ex">suponer → supón</span>, <span class="ex">mantener → mantén</span>, <span class="ex">detener → detén</span>, <span class="ex">obtener → obtén</span>, <span class="ex">deshacer → deshaz</span>. Формы bendecir и maldecir правильные: <span class="ex">bendice, maldice</span>.</p> <p class="warn">Не путай: <b>ve</b> – это и ir («иди»), и ver («смотри»). Смысл подсказывает контекст.</p> </details> <details data-sec="ud"><summary>Usted и ustedes</summary> <p>Вежливое «Вы» (usted) и множественное «вы» (ustedes) используют формы subjuntivo третьего лица.</p> <div class="tblwrap"><table class="tbl"> <thead><tr><th></th><th>(+) утвердительный</th><th>(–) отрицательный</th></tr></thead> <tbody> <tr><td>usted</td><td><span class="ex">hable, coma, escriba</span></td><td><span class="ex">no hable, no coma, no escriba</span></td></tr> <tr><td>ustedes</td><td><span class="ex">hablen, coman, escriban</span></td><td><span class="ex">no hablen, no coman, no escriban</span></td></tr> </tbody></table></div> <ul class="tight"> <li>Неправильность yo переходит сюда: <span class="ex">tenga, haga, diga, conozca</span>.</li> <li>Корень меняется так же, как в tú: <span class="ex">cierre, duerma, pida</span>.</li> <li>Орфография: <span class="ex">busque, pague, empiece</span>.</li> <li>Местоимения (+) присоединяются в конец, ударение сдвигается: <span class="ex">dígame, siéntese, díganmelo</span>.</li> <li>В Латинской Америке <b>ustedes</b> заменяет vosotros и в утвердительной, и в отрицательной форме.</li> </ul> <div class="mt-row"> <div class="mt" data-conj="tener"></div><div class="mt" data-conj="cerrar"></div><div class="mt" data-conj="buscar"></div> </div> </details> <details data-sec="vosotros"><summary>Vosotros (Испания)</summary> <p><b>(+)</b> инфинитив, у которого -r заменяется на -d: <span class="ex">hablar → hablad</span>, <span class="ex">comer → comed</span>, <span class="ex">escribir → escribid</span>, <span class="ex">hacer → haced</span>, <span class="ex">decir → decid</span>, <span class="ex">ir → id</span>, <span class="ex">ser → sed</span>.</p> <p>Исключений в формах нет, корень никогда не чередуется: <span class="ex">dormid, pedid, volved, sentid</span>.</p> <p><b>(–)</b> совсем другая форма, это subjuntivo: <span class="ex">no habléis, no comáis, no escribáis, no hagáis</span>. Ошибка <span class="bad">no hablad</span> встречается очень часто.</p> <p class="small muted">Форма vosotros используется только в Испании. В Мексике и Латинской Америке вместо неё говорят ustedes.</p> <div class="mt-row"> <div class="mt" data-conj="hablar"></div><div class="mt" data-conj="dormir"></div><div class="mt" data-conj="ir"></div> </div> </details> <details data-sec="boot"><summary>Изменение корня (e→ie, o→ue, e→i)</summary> <p>Корень меняется там, где ударение падает на него, то есть в tú, usted, ustedes. В формах с ударным окончанием (nosotros, vosotros в subjuntivo) корень часто возвращается к обычному:</p> <ul class="tight"> <li><b>-ar / -er:</b> в vosotros (–) и nosotros чередования <b>нет</b>: no penséis, pensemos; no volváis, volvamos.</li> <li><b>-ir:</b> там чередование остаётся в слабой форме: <b>e → i</b> (sentir: no sintáis, sintamos) и <b>o → u</b> (dormir: no durmáis, durmamos).</li> <li>Глаголы <b>e → i</b> (pedir, repetir, servir, seguir, vestir) меняют корень во всех формах subjuntivo: no pidáis, pidamos.</li> <li>Vosotros (+) берётся из инфинитива, поэтому там корень <b>не меняется</b>: dormid, pedid, sentid.</li> </ul> <div class="mt-row"> <div class="mt" data-conj="pensar"></div><div class="mt" data-conj="dormir"></div><div class="mt" data-conj="pedir"></div> </div> </details> <details data-sec="go"><summary>Неправильная форма yo</summary> <p>Subjuntivo строится от формы <b>yo</b>, поэтому её неправильность попадает в usted, ustedes и во все отрицательные формы. В tú (+) и vosotros (+) этого нет.</p> <div class="tblwrap"><table class="tbl"> <thead><tr><th>Тип</th><th>yo → subjuntivo</th></tr></thead> <tbody> <tr><td>-go</td><td class="ex">tengo → tenga · hago → haga · digo → diga · salgo → salga · pongo → ponga · vengo → venga · traigo → traiga · oigo → oiga</td></tr> <tr><td>-zco</td><td class="ex">conozco → conozca · conduzco → conduzca · traduzco → traduzca · ofrezco → ofrezca</td></tr> <tr><td>-yo</td><td class="ex">construyo → construya · huyo → huya</td></tr> </tbody></table></div> <p>Для tú (+) у восьми глаголов есть особые формы (см. тему «Tú»), а у остальных он берётся из él: <span class="ex">conoce, traduce, construye, trae</span>.</p> <div class="mt-row"> <div class="mt" data-conj="tener"></div><div class="mt" data-conj="conocer"></div><div class="mt" data-conj="construir"></div> </div> </details> <details data-sec="spell"><summary>Орфографические изменения</summary> <p>Чтобы сохранить звук, меняется написание перед <b>e</b>. Это касается всех форм из subjuntivo (usted, ustedes, все отрицательные), но <b>не</b> tú (+) и vosotros (+): <span class="ex">busca, pagad</span>.</p> <div class="tblwrap"><table class="tbl"> <thead><tr><th>Окончание</th><th>Изменение</th><th>Пример</th></tr></thead> <tbody> <tr><td>-car</td><td class="ex">c → qu</td><td class="ex">buscar: busque, no busques</td></tr> <tr><td>-gar</td><td class="ex">g → gu</td><td class="ex">pagar: pague, no pagues</td></tr> <tr><td>-zar</td><td class="ex">z → c</td><td class="ex">empezar: empiece, no empieces</td></tr> <tr><td>-guar</td><td class="ex">gu → gü</td><td class="ex">averiguar: averigüe, no averigües</td></tr> <tr><td>-ger, -gir</td><td class="ex">g → j</td><td class="ex">coger: coja; elegir: elija</td></tr> <tr><td>-guir</td><td class="ex">gu → g</td><td class="ex">seguir: siga, no sigas</td></tr> <tr><td>-cer, -cir (после согласной)</td><td class="ex">c → z</td><td class="ex">vencer: venza</td></tr> <tr><td>-cer, -cir (после гласной)</td><td class="ex">c → zc</td><td class="ex">conocer: conozca; conducir: conduzca</td></tr> <tr><td>-iar, -uar (часть глаголов)</td><td class="ex">ударение на i / u</td><td class="ex">enviar: envía, envíe; continuar: continúa, continúe</td></tr> </tbody></table></div> <div class="mt-row"> <div class="mt" data-conj="buscar"></div><div class="mt" data-conj="llegar"></div><div class="mt" data-conj="empezar"></div> </div> </details> <details data-sec="irr"><summary>Особые глаголы: ser, ir, estar, dar, saber, ver</summary> <p>У них subjuntivo образуется не от формы yo. Эти формы нужно просто выучить:</p> <div data-irrtable></div> <ul class="tight"> <li><b>dar</b>: <span class="ex">dé</span> с ударением (чтобы отличать от предлога de), но с местоимением: <span class="ex">deme</span>, <span class="ex">démelo</span>.</li> <li><b>estar</b>: везде ударение: <span class="ex">está, esté, estés, estén, estéis</span>.</li> <li><b>ir</b>: <span class="ex">ve</span> (tú +), <span class="ex">id</span> (vosotros +), остальное от <span class="ex">vaya-</span>. Форма nosotros разобрана в дополнительной теме.</li> </ul> </details> <details data-sec="pron"><summary>Местоимения и ударение</summary> <div class="tblwrap"><table class="tbl"> <thead><tr><th>Глагол</th><th>Утвердительный (+)</th><th>Отрицательный (–)</th></tr></thead> <tbody> <tr><td>hablar</td><td class="ex">háblame</td><td class="ex">no me hables</td></tr> <tr><td>comprar</td><td class="ex">cómpralo</td><td class="ex">no lo compres</td></tr> <tr><td>hacer</td><td class="ex">hazlo</td><td class="ex">no lo hagas</td></tr> <tr><td>decir</td><td class="ex">dímelo</td><td class="ex">no me lo digas</td></tr> <tr><td>dar + le + lo</td><td class="ex">dáselo</td><td class="ex">no se lo des</td></tr> <tr><td>levantarse</td><td class="ex">levántate</td><td class="ex">no te levantes</td></tr> </tbody></table></div> <ul class="tight"> <li><b>(+)</b> местоимения присоединяются к глаголу <b>слитно</b>, в конце. <b>(–)</b> они стоят <b>отдельно перед глаголом</b>, после no.</li> <li><b>Порядок:</b> сначала возвратное или косвенное (me, te, se, nos, os), потом прямое (lo, la, los, las): <span class="ex">dímelo</span>, <span class="ex">no te lo pongas</span>.</li> <li><b>le / les + lo / la / los / las → se:</b> <span class="ex">díselo</span>, <span class="ex">no se lo digas</span>. Ошибка: <span class="bad">dile lo</span>.</li> <li><b>Ударение:</b> оно остаётся на том же слоге, поэтому, если слово становится длиннее, нужен знак: <span class="ex">da → dame → dámelo</span>; <span class="ex">compra → cómpralo</span>; <span class="ex">di → dime → dímelo</span>. Если ударный слог предпоследний, знака нет: <span class="ex">hazlo, dime, ponlo</span>.</li> <li><b>vosotros (+):</b> перед <b>os</b> отпадает -d: <span class="ex">levantaos</span>. Перед остальными остаётся: <span class="ex">compradlo, dadme</span>. Исключение: <span class="ex">idos</span>.</li> </ul> <p>Попробуй сам во вкладке «Спряжение»: там можно добавить косвенное и прямое местоимение к любому глаголу.</p> </details> <details data-sec="refl"><summary>Возвратные глаголы</summary> <p>Возвратное местоимение подчиняется тем же правилам: в (+) оно сливается с глаголом, в (–) стоит перед ним.</p> <div class="mt-row"> <div class="mt" data-conj="levantarse"></div><div class="mt" data-conj="vestirse"></div><div class="mt" data-conj="irse"></div> </div> <ul class="tight"> <li>У vosotros (+) отпадает -d: <span class="ex">levantaos, poneos, vestíos</span>. Знак в <span class="ex">vestíos</span> и <span class="ex">divertíos</span> нужен, чтобы показать ударение на i.</li> <li>У tú (+) ударение сдвигается: <span class="ex">levántate, siéntate, vístete, ponte</span>.</li> <li>Для usted и ustedes: <span class="ex">levántese, siéntense</span>.</li> </ul> </details> <details data-sec="nos"><summary>Nosotros: «давайте…» (дополнительно)</summary> <p class="warn">Эта форма не входит в основу четырёх лиц. В тренировке её можно включать и отключать отдельно.</p> <p>Смысл: приглашение сделать что-то вместе. Форма берётся из subjuntivo: <span class="ex">hablemos, comamos, vivamos</span>. Отрицание: <span class="ex">no hablemos</span>.</p> <ul class="tight"> <li>Часто вместо неё говорят <span class="ex">vamos a + инфинитив</span>: <span class="ex">vamos a comer</span>. В отрицании так не говорят.</li> <li><b>ir:</b> утвердительная форма <span class="ex">vamos</span> (реже <span class="ex">vayamos</span>). Отрицание только <span class="ex">no vayamos</span>.</li> <li><b>-ir с чередованием:</b> e → i и o → u: <span class="ex">sintamos, durmamos, pidamos</span>. У -ar/-er чередования нет: <span class="ex">pensemos, volvamos</span>.</li> <li><b>С местоимениями (+):</b> перед <b>nos / se</b> отпадает конечная -s: <span class="ex">levantémonos, démoselo</span>. Перед остальными остаётся: <span class="ex">comprémoslo</span>.</li> </ul> <div class="mt-row"> <div class="mt" data-conj="hablar" data-persons="nosotros"></div><div class="mt" data-conj="dormir" data-persons="nosotros"></div><div class="mt" data-conj="ir" data-persons="nosotros"></div><div class="mt" data-conj="levantarse" data-persons="nosotros"></div> </div> </details> <details data-sec="voseo"><summary>Vos: Аргентина, Уругвай и др. (дополнительно)</summary> <p class="warn">Эта форма не входит в основу, её нет ни в Испании, ни в Мексике. В тренировке её можно включать отдельно.</p> <p>В регионах с <b>voseo</b> вместо tú используют vos.</p> <ul class="tight"> <li><b>(+)</b> инфинитив без -r, ударение на последнем слоге: <span class="ex">hablá, comé, viví, poné, decí, hacé, vení, tené</span>. Чередования корня нет.</li> <li>Особые формы: <span class="ex">ir → andá</span>, <span class="ex">ser → sé</span>.</li> <li><b>(–)</b> обычно как у tú: <span class="ex">no hables, no comas</span>. В Аргентине и Уругвае также встречается <span class="ex">no hablés, no comás</span>. Принимаются оба варианта.</li> <li><b>С местоимениями:</b> знак ударения обычно исчезает: <span class="ex">decime, hacelo, esperame, levantate</span>. Если слово получается длинным, знак нужен: <span class="ex">decíselo</span>.</li> </ul> <div class="mt-row"> <div class="mt" data-conj="hablar" data-persons="vos"></div><div class="mt" data-conj="tener" data-persons="vos"></div><div class="mt" data-conj="ir" data-persons="vos"></div><div class="mt" data-conj="levantarse" data-persons="vos"></div> </div> </details> <details data-sec="errors"><summary>Типичные ошибки</summary> <div class="tblwrap"><table class="tbl"> <thead><tr><th>Неверно</th><th>Верно</th><th>Почему</th></tr></thead> <tbody> <tr><td class="bad ex">no habla</td><td class="good ex">no hables</td><td>отрицание – subjuntivo</td></tr> <tr><td class="bad ex">no hablad</td><td class="good ex">no habléis</td><td>vosotros (–) – subjuntivo</td></tr> <tr><td class="bad ex">hace la tarea</td><td class="good ex">haz la tarea</td><td>неправильная tú (+)</td></tr> <tr><td class="bad ex">no haz</td><td class="good ex">no hagas</td><td>в отрицании нет «коротких» форм</td></tr> <tr><td class="bad ex">dilo me</td><td class="good ex">dímelo</td><td>слитно + порядок + ударение</td></tr> <tr><td class="bad ex">no dímelo</td><td class="good ex">no me lo digas</td><td>в отрицании местоимения перед глаголом</td></tr> <tr><td class="bad ex">dale lo</td><td class="good ex">dáselo</td><td>le + lo → se</td></tr> <tr><td class="bad ex">levantadse</td><td class="good ex">levantaos</td><td>-d отпадает перед os</td></tr> <tr><td class="bad ex">dormamos</td><td class="good ex">durmamos</td><td>-ir: o → u в nosotros</td></tr> <tr><td class="bad ex">no busces</td><td class="good ex">no busques</td><td>c → qu перед e</td></tr> </tbody></table></div> </details> </template> <template id="tpl-presente"> <details data-sec="intro"><summary>Обзор: что такое Presente</summary> <p><b>Presente de indicativo</b> – настоящее время изъявительного наклонения. Им говорят о том, что происходит сейчас, что бывает регулярно, что верно всегда, и часто о ближайшем будущем.</p> <p class="key">Формула: <b>основа</b> (инфинитив без -ar / -er / -ir) + <b>окончание</b>. Форм шесть: yo, tú, él/ella/usted, nosotros, vosotros, ellos/ustedes.</p> <div data-ptable="hablar,comer,vivir"></div> <p class="small muted">Синим выделены окончания, шафрановым – формы, которые отходят от правила. Знак ударения подчёркнут.</p> <ul class="tight"> <li>Подлежащее часто опускают: <span class="ex">Hablo español</span> (понятно, что «я»).</li> <li>Три типа окончаний: <b>-ar</b> (hablar), <b>-er</b> (comer), <b>-ir</b> (vivir).</li> <li>Неправильных глаголов много, но они делятся на понятные группы: в этом разделе они идут по порядку.</li> </ul> </details> <details data-sec="ending"><summary>Окончания -ar, -er, -ir</summary> <p>У правильных глаголов корень не меняется, меняется только окончание:</p> <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>-ar</th><th>-er</th><th>-ir</th></tr></thead><tbody> <tr><td>yo</td><td class="form"><span class="end">-o</span></td><td class="form"><span class="end">-o</span></td><td class="form"><span class="end">-o</span></td></tr> <tr><td>tú</td><td class="form"><span class="end">-as</span></td><td class="form"><span class="end">-es</span></td><td class="form"><span class="end">-es</span></td></tr> <tr><td>él / ella / usted</td><td class="form"><span class="end">-a</span></td><td class="form"><span class="end">-e</span></td><td class="form"><span class="end">-e</span></td></tr> <tr><td>nosotros</td><td class="form"><span class="end">-amos</span></td><td class="form"><span class="end">-emos</span></td><td class="form"><span class="end">-imos</span></td></tr> <tr><td>vosotros</td><td class="form"><span class="end">-áis</span></td><td class="form"><span class="end">-éis</span></td><td class="form"><span class="end">-ís</span></td></tr> <tr><td>ellos / ustedes</td><td class="form"><span class="end">-an</span></td><td class="form"><span class="end">-en</span></td><td class="form"><span class="end">-en</span></td></tr> </tbody></table></div> <p class="key">Запомнить легче так: у <b>-er</b> и <b>-ir</b> окончания одинаковые, кроме <b>nosotros</b> (-emos / -imos) и <b>vosotros</b> (-éis / -ís). У <b>-ar</b> везде гласная <b>a</b>, кроме yo.</p> <div class="mt-row"><div class="mt" data-conj="trabajar"></div><div class="mt" data-conj="aprender"></div><div class="mt" data-conj="escribir"></div></div> </details> <details data-sec="persons"><summary>Лица и местоимения</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>Местоимение</th><th>По-русски</th><th>Форма глагола</th></tr></thead><tbody> <tr><td>yo</td><td>я</td><td class="form">hablo</td></tr> <tr><td>tú</td><td>ты</td><td class="form">hablas</td></tr> <tr><td>él / ella / <b>usted</b></td><td>он / она / Вы</td><td class="form">habla</td></tr> <tr><td>nosotros / nosotras</td><td>мы</td><td class="form">hablamos</td></tr> <tr><td>vosotros / vosotras</td><td>вы (Испания)</td><td class="form">habláis</td></tr> <tr><td>ellos / ellas / <b>ustedes</b></td><td>они / Вы (мн.)</td><td class="form">hablan</td></tr> </tbody></table></div> <ul class="tight"> <li><b>usted</b> – вежливое «Вы» к одному человеку, глагол стоит как у él/ella. <b>ustedes</b> – «вы» ко многим, глагол как у ellos.</li> <li><b>vosotros</b> используют в Испании как обычное «вы» к друзьям. В Латинской Америке его нет: говорят <b>ustedes</b>. Поэтому в тренировке vosotros можно отключить.</li> <li>Местоимение нужно, если оно что-то уточняет или противопоставляет: <span class="ex">Él trabaja, yo estudio</span>. Если и так понятно, его опускают: <span class="ex">Vivo en Moscú</span>.</li> <li>Для «они, все женщины» говорят <b>ellas</b>, для смешанной группы <b>ellos</b>.</li> </ul> </details> <details data-sec="boot"><summary>Чередование корня (e→ie, o→ue, e→i, u→ue)</summary> <p>У многих глаголов гласная корня меняется, когда на неё падает ударение. Это формы <b>yo, tú, él, ellos</b>. В <b>nosotros</b> и <b>vosotros</b> ударение уходит на окончание, и корень остаётся прежним. Получается «ботинок»: меняются четыре формы, не меняются две.</p> <div data-ptable="pensar,querer,sentir"></div> <ul class="tight"> <li><b>e → ie:</b> pensar, cerrar, empezar, querer, entender, perder, sentir, preferir, mentir…</li> <li><b>o → ue:</b> poder, dormir, volver, encontrar, contar, recordar, mostrar, morir… (у <b>oler</b> появляется h: huelo)</li> <li><b>e → i</b> (только глаголы на -ir): pedir, repetir, servir, vestir, seguir, elegir, medir…</li> <li><b>u → ue:</b> только <b>jugar</b>: juego, juegas, juega, jugamos, jugáis, juegan.</li> </ul> <div data-ptable="poder,dormir,volver,pedir,servir,jugar"></div> <p class="warn"><b>Ловушка:</b> в nosotros и vosotros чередования нет. <span class="bad">piensamos</span> → <span class="good">pensamos</span>, <span class="bad">puedéis</span> → <span class="good">podéis</span>.</p> </details> <details data-sec="go"><summary>Особая форма yo (-go, -zco)</summary> <p>У этих глаголов особая форма только в <b>yo</b>. Остальные формы по общему правилу (но у <b>tener, venir, decir</b> ещё и чередуется корень в ударных формах: tienes, vienes, dices).</p> <div data-ptable="tener,venir,poner,salir,hacer,decir,traer,caer,valer"></div> <ul class="tight"> <li><b>-go:</b> tener → tengo, venir → vengo, poner → pongo, salir → salgo, hacer → hago, decir → digo, traer → traigo, caer → caigo, valer → valgo. Приставочные глаголы идут так же: mantener, obtener, componer, suponer, deshacer, predecir…</li> <li><b>-zco</b> (глаголы на -cer / -cir после гласной): conocer → conozco, parecer → parezco, conducir → conduzco, traducir → traduzco, ofrecer → ofrezco, agradecer → agradezco, nacer → nazco.</li> </ul> <div data-ptable="conocer,conducir,ofrecer,parecer"></div> <p class="warn">Исключения из -cer: <b>hacer</b> (hago), <b>cocer</b> и <b>mecer</b> (cuezo, mezo – редкие). Глагол <b>decir</b> – особый случай: digo, dices.</p> </details> <details data-sec="spell"><summary>Орфография в yo (g→j, c→z, gu→g)</summary> <p>Эти глаголы по звуку правильные, но в форме <b>yo</b> меняется написание: перед <b>-o</b> буква, которая читалась бы иначе, заменяется.</p> <div data-ptable="coger,dirigir,vencer,ejercer,distinguir,extinguir"></div> <ul class="tight"> <li><b>g → j</b> (глаголы на -ger, -gir): coger → cojo, escoger → escojo, dirigir → dirijo, exigir → exijo, proteger → protejo. Перед <b>o</b> буква g читалась бы как [г], а нужен звук [х].</li> <li><b>c → z</b> (-cer после согласной, -cir): vencer → venzo, convencer → convenzo, ejercer → ejerzo, esparcir → esparzo.</li> <li><b>gu → g</b> (-guir): distinguir → distingo, extinguir → extingo.</li> </ul> <p class="small muted">Остальные формы такие же, как у обычных глаголов: coges, coge, cogemos, cogéis, cogen.</p> </details> <details data-sec="acc"><summary>Ударение и -uir (envío, continúo, construyo, río)</summary> <p><b>1. -iar / -uar с ударением на i / u.</b> У части глаголов ударение падает на <b>í / ú</b>, и в ударных формах ставится знак ударения. В nosotros и vosotros ударения на корне нет.</p> <div data-ptable="enviar,confiar,guiar,variar,continuar,actuar"></div> <p class="small muted">Но у большинства глаголов на -iar такого ударения нет: <b>estudio, estudias, cambio, limpio, odio, copio</b>. Такие глаголы правильные.</p> <p><b>2. -uir: добавляется y.</b> Перед окончаниями -o, -es, -e, -en появляется <b>y</b>: construir → construyo, construyes, construye, construyen. В nosotros и vosotros y нет: construimos, construís.</p> <div data-ptable="construir,incluir,destruir,contribuir,huir"></div> <p class="small muted"><b>huir</b>: vosotros huis пишется без ударения (односложная форма). Не относятся сюда глаголы на -guir (seguir, distinguir) – у них нет y.</p> <p><b>3. Семья reír:</b> reír, sonreír, freír: río, ríes, ríe, <b>reímos</b>, <b>reís</b>, ríen. Знак ударения на í в ударных формах.</p> <div data-ptable="reír,sonreír,freír"></div> </details> <details data-sec="irr"><summary>ser, estar, ir, dar, ver, saber, oír, caber</summary> <p>Эти глаголы нужно просто выучить. У большинства из них особая форма <b>yo</b>, а у <b>ser</b> и <b>ir</b> особые все формы.</p> <div data-ptable="ser,estar,ir,dar,ver,saber,oír,caber"></div> <ul class="tight"> <li><b>ser</b> и <b>ir</b> – полностью особые: soy, eres, es, somos, sois, son; voy, vas, va, vamos, vais, van.</li> <li><b>estar</b> и <b>dar</b>: yo estoy, yo doy. Остальные формы правильные, но у estar во всех формах кроме nosotros ударение на окончании (estás, está, están, estáis). У dar vosotros dais без знака ударения.</li> <li><b>ver</b>: veo, но ves, ve, vemos, veis (vosotros без знака ударения). <b>saber</b>: sé (со знаком ударения, чтобы отличать от se), остальное правильно.</li> <li><b>oír</b>: oigo, oyes, oye, oímos, oís, oyen. <b>caber</b>: quepo, cabes…</li> <li>Безличное <b>hay</b> («есть», «имеется») – особая форма глагола haber: <span class="ex">Hay un libro en la mesa</span>.</li> </ul> </details> <details data-sec="refl"><summary>Возвратные глаголы</summary> <p>У возвратных глаголов (-se в инфинитиве) перед формой стоит местоимение, которое согласуется с лицом: <b>me, te, se, nos, os, se</b>.</p> <div class="mt-row"><div class="mt" data-conj="levantarse"></div><div class="mt" data-conj="acostarse"></div><div class="mt" data-conj="irse"></div></div> <ul class="tight"> <li>Местоимение стоит <b>перед</b> спрягаемым глаголом и пишется отдельно: <span class="ex">Me levanto a las siete</span>.</li> <li>Правила корня работают так же: acostarse – me <b>acuesto</b>, nos acostamos; vestirse – me <b>visto</b>, nos vestimos; ponerse – me <b>pongo</b>.</li> <li>С инфинитивом местоимение можно поставить перед глаголом или присоединить к инфинитиву: <span class="ex">Voy a levantarme</span> = <span class="ex">Me voy a levantar</span>.</li> <li>Многие глаголы меняют смысл с -se: <b>ir</b> (идти) – <b>irse</b> (уходить, уезжать), <b>dormir</b> (спать) – <b>dormirse</b> (засыпать), <b>llamar</b> (звать) – <b>llamarse</b> (называться).</li> </ul> </details> <details data-sec="use"><summary>Когда употребляется Presente</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>Значение</th><th>Пример</th></tr></thead><tbody> <tr><td>То, что происходит сейчас</td><td class="ex">Ahora estudio español.</td></tr> <tr><td>Привычка, регулярное действие (todos los días, siempre, a menudo)</td><td class="ex">Todos los días desayuno a las ocho.</td></tr> <tr><td>Общие истины, факты</td><td class="ex">La Tierra gira alrededor del Sol.</td></tr> <tr><td>Постоянное состояние, описание</td><td class="ex">Vivo en Madrid. Mi hermana tiene treinta años.</td></tr> <tr><td>Ближайшее будущее и планы</td><td class="ex">Mañana voy al médico.</td></tr> <tr><td>Просьба и предложение (вежливо)</td><td class="ex">¿Me ayudas? ¿Quieres un café?</td></tr> <tr><td>Инструкция</td><td class="ex">Primero abres el archivo y luego pulsas el botón.</td></tr> <tr><td>Условие: si + Presente</td><td class="ex">Si llueve, me quedo en casa.</td></tr> <tr><td>Исторический Presente (оживляет рассказ)</td><td class="ex">En 1492 Colón llega a América.</td></tr> <tr><td>Срок: hace … que / desde hace</td><td class="ex">Hace dos años que vivo aquí. = Vivo aquí desde hace dos años.</td></tr> </tbody></table></div> <ul class="tight"> <li>Для действия <b>прямо в эту минуту</b> чаще говорят <b>estar + gerundio</b>: <span class="ex">Estoy comiendo</span> («я сейчас ем»). Просто <span class="ex">como</span> – «я ем» вообще.</li> <li>Для близкого будущего есть <b>ir a + инфинитив</b>: <span class="ex">Voy a llamar a mi madre</span>. Само <b>ir</b> стоит в Presente.</li> <li>В русском настоящем нет разницы «сейчас» и «вообще», в испанском она есть, отсюда и estar + gerundio.</li> </ul> </details> <details data-sec="serestar"><summary>Ser и estar</summary> <p>Оба глагола значат «быть», но используются по-разному.</p> <div class="tblwrap"><table class="tbl"><thead><tr><th>ser</th><th>estar</th></tr></thead><tbody> <tr><td><b>Кто / что это.</b> <span class="ex">Soy ruso. Es médico.</span></td><td><b>Где находится.</b> <span class="ex">Estoy en Madrid. El libro está en la mesa.</span></td></tr> <tr><td><b>Характеристика, свойство.</b> <span class="ex">Mi casa es grande. Ella es simpática.</span></td><td><b>Состояние, настроение, результат.</b> <span class="ex">Estoy cansado. La puerta está abierta.</span></td></tr> <tr><td><b>Время, дата.</b> <span class="ex">Son las tres. Hoy es lunes.</span></td><td><b>estar + gerundio.</b> <span class="ex">Estamos comiendo.</span></td></tr> <tr><td><b>Материал, принадлежность.</b> <span class="ex">La mesa es de madera. Es de Ana.</span></td><td><b>estar de / en + состояние.</b> <span class="ex">Está de vacaciones.</span></td></tr> </tbody></table></div> <p class="key">Правило-ориентир: <b>ser</b> – «что это за человек или предмет», <b>estar</b> – «где он и в каком он состоянии сейчас».</p> <p>Смысл прилагательного меняется:</p> <div class="tblwrap"><table class="tbl"><thead><tr><th>Прилагательное</th><th>с ser</th><th>с estar</th></tr></thead><tbody> <tr><td>aburrido</td><td>скучный</td><td>скучающий</td></tr> <tr><td>listo</td><td>умный</td><td>готовый</td></tr> <tr><td>malo</td><td>плохой</td><td>больной</td></tr> <tr><td>rico</td><td>богатый</td><td>вкусный</td></tr> <tr><td>verde</td><td>зелёный</td><td>неспелый</td></tr> </tbody></table></div> </details> <details data-sec="voseo"><summary>Vos (Аргентина и др.)</summary> <p>В Аргентине, Уругвае, Парагвае и части Центральной Америки вместо <b>tú</b> говорят <b>vos</b>. Глагол: основа + <b>-ás / -és / -ís</b>, ударение на окончании. <b>Чередования корня нет.</b></p> <div data-ptable="hablar,comer,vivir,tener,querer,pedir,ser,ir" data-vos></div> <ul class="tight"> <li>Формы vos: <b>hablás, comés, vivís</b>; <b>tenés, querés, podés, pedís</b> (корень без чередования).</li> <li>Особые: <b>vos sos</b> (ser), <b>vos vas</b> (ir), <b>vos estás</b>, <b>vos ves</b>, <b>vos das</b>.</li> <li>Остальные лица те же, что в обычном испанском.</li> </ul> </details> <details data-sec="errors"><summary>Типичные ошибки</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>Неверно</th><th>Верно</th><th>Почему</th></tr></thead><tbody> <tr><td class="bad">yo teno</td><td class="good ex">yo tengo</td><td>особая форма yo</td></tr> <tr><td class="bad">nosotros piensamos</td><td class="good ex">nosotros pensamos</td><td>в nosotros нет чередования</td></tr> <tr><td class="bad">vosotros puedéis</td><td class="good ex">vosotros podéis</td><td>в vosotros нет чередования</td></tr> <tr><td class="bad">yo jugo</td><td class="good ex">yo juego</td><td>jugar: u → ue</td></tr> <tr><td class="bad">tú pedes</td><td class="good ex">tú pides</td><td>pedir: e → i</td></tr> <tr><td class="bad">yo conoco</td><td class="good ex">yo conozco</td><td>-zco</td></tr> <tr><td class="bad">yo sabo</td><td class="good ex">yo sé</td><td>особая форма saber</td></tr> <tr><td class="bad">yo construo</td><td class="good ex">yo construyo</td><td>-uir: добавляется y</td></tr> <tr><td class="bad">yo envio</td><td class="good ex">yo envío</td><td>знак ударения на í</td></tr> <tr><td class="bad">tu hablas</td><td class="good ex">tú hablas</td><td>tú с ударением – местоимение «ты»</td></tr> <tr><td class="bad">yo llamo Pedro</td><td class="good ex">me llamo Pedro</td><td>llamarse – возвратный</td></tr> <tr><td class="bad">yo soy cansado</td><td class="good ex">estoy cansado</td><td>состояние – estar</td></tr> <tr><td class="bad">ellos está</td><td class="good ex">ellos están</td><td>окончание -n у ellos</td></tr> </tbody></table></div> </details> </template> <template id="tpl-perfecto"> <details data-sec="intro"><summary>Обзор: что такое Perfecto</summary> <p><b>Pretérito perfecto compuesto</b> – прошедшее время, которое связано с настоящим: действие закончено, но результат или период ещё «с нами». По-русски это чаще всего обычное прошедшее: «я поел», «я уже сделал».</p> <p class="key">Формула: <b>haber</b> в Presente (he, has, ha, hemos, habéis, han) + <b>participio</b> (hablado, comido, vivido). Форма participio <b>не меняется</b> по лицам и числам.</p> <div class="mt-row"><div class="mt" data-conj="hablar"></div><div class="mt" data-conj="comer"></div><div class="mt" data-conj="vivir"></div></div> <p class="small muted">Синим выделены haber и окончание причастия, шафрановым – неправильное причастие.</p> <ul class="tight"> <li>Между <b>haber</b> и причастием ничего не ставят: <span class="ex">Ya he comido</span>, <span class="ex">No he comido</span>.</li> <li>Не путай <b>haber</b> («иметь» как вспомогательный) и <b>tener</b> («иметь» что-то): <span class="ex">He comprado un libro</span>, но <span class="ex">Tengo un libro</span>.</li> <li>Местоимение обычно опускают: <span class="ex">He terminado</span> – понятно, что «я».</li> </ul> </details> <details data-sec="haber"><summary>Вспомогательный глагол haber</summary> <p>В Perfecto меняется только <b>haber</b>. Это неправильный глагол, формы нужно выучить:</p> <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>haber (Presente)</th></tr></thead><tbody> <tr><td>yo</td><td class="form"><span class="end">he</span></td></tr> <tr><td>tú</td><td class="form"><span class="end">has</span></td></tr> <tr><td>él / ella / usted</td><td class="form"><span class="end">ha</span></td></tr> <tr><td>nosotros</td><td class="form"><span class="end">hemos</span></td></tr> <tr><td>vosotros</td><td class="form"><span class="end">habéis</span></td></tr> <tr><td>ellos / ustedes</td><td class="form"><span class="end">han</span></td></tr> </tbody></table></div> <ul class="tight"> <li>Формы <b>hemos</b> и <b>habéis</b> сохраняют основу hab-; в остальных она сокращена: he, has, ha, han.</li> <li><b>Hay</b> («есть, имеется») – особая безличная форма того же haber, в Perfecto не используется.</li> <li>Шесть форм учат наизусть: <b>he, has, ha, hemos, habéis, han</b>.</li> </ul> </details> <details data-sec="part"><summary>Participio: -ado и -ido</summary> <p>Правильное причастие образуется от основы:</p> <div class="tblwrap"><table class="tbl"><thead><tr><th>Инфинитив</th><th>Причастие</th><th>Пример</th></tr></thead><tbody> <tr><td>-ar</td><td class="form"><span class="end">-ado</span></td><td class="ex">hablar → hablado</td></tr> <tr><td>-er</td><td class="form"><span class="end">-ido</span></td><td class="ex">comer → comido</td></tr> <tr><td>-ir</td><td class="form"><span class="end">-ido</span></td><td class="ex">vivir → vivido</td></tr> </tbody></table></div> <div data-parts="trabajar,estudiar,comprar,aprender,beber,vender,salir,decidir,recibir"></div> <p class="key"><b>Ударение на í:</b> если основа заканчивается на гласную a, e, o, то две гласные подряд не образуют дифтонг, и над -i- ставят знак ударения: <b>-aído, -eído, -oído</b>.</p> <div data-parts="leer,creer,caer,traer,oír,reír,sonreír"></div> <ul class="tight"> <li><b>leer → leído</b>, <b>creer → creído</b>, <b>caer → caído</b>, <b>traer → traído</b>, <b>oír → oído</b>, <b>reír → reído</b>.</li> <li>Если перед -ido стоит согласная, знака нет: <b>vivido, salido, venido</b>.</li> <li>Производные глаголы повторяют причастие: <b>mantener → mantenido</b>, <b>contener → contenido</b>.</li> </ul> <p class="warn"><b>Ловушка:</b> <span class="bad">leido</span> → <span class="good">leído</span>, <span class="bad">trayido</span> → <span class="good">traído</span>.</p> </details> <details data-sec="irrp"><summary>Неправильные причастия</summary> <p>Около двух десятков глаголов дают причастие на <b>-to</b> или <b>-cho</b>. Их нужно просто выучить, а приставочные глаголы идут так же.</p> <div data-parts="abrir,cubrir,descubrir,escribir,decir,hacer,morir,poner,ver,volver,romper,resolver"></div> <div class="tblwrap"><table class="tbl"><thead><tr><th>Окончание</th><th>Глаголы</th></tr></thead><tbody> <tr><td class="form"><span class="irr">-to</span></td><td>abrir → <b>abierto</b>, cubrir → <b>cubierto</b>, escribir → <b>escrito</b>, morir → <b>muerto</b>, poner → <b>puesto</b>, ver → <b>visto</b>, volver → <b>vuelto</b>, romper → <b>roto</b>, resolver → <b>resuelto</b></td></tr> <tr><td class="form"><span class="irr">-cho</span></td><td>decir → <b>dicho</b>, hacer → <b>hecho</b>, satisfacer → <b>satisfecho</b></td></tr> </tbody></table></div> <ul class="tight"> <li><b>Приставки:</b> descubrir → descubierto, componer → compuesto, suponer → supuesto, devolver → devuelto, deshacer → deshecho, predecir → predicho, prever → previsto.</li> <li><b>freír</b> имеет два причастия: <b>frito</b> и <b>freído</b>.</li> <li>Многие из этих причастий становятся прилагательными: <b>abierto, cerrado, roto, escrito, hecho</b>.</li> </ul> <p class="warn"><b>Ловушка:</b> <span class="bad">he hacido</span> → <span class="good">he hecho</span>, <span class="bad">he escribido</span> → <span class="good">he escrito</span>, <span class="bad">he ponido</span> → <span class="good">he puesto</span>.</p> </details> <details data-sec="order"><summary>Возвратные и порядок слов</summary> <p>Возвратное (и любое другое безударное) местоимение стоит <b>перед haber</b>, не перед причастием и не после него:</p> <div class="mt-row"><div class="mt" data-conj="levantarse"></div><div class="mt" data-conj="ducharse"></div></div> <ul class="tight"> <li><span class="ex">Me he levantado temprano.</span> – <span class="bad">He levantado me</span>, <span class="bad">He me levantado</span>.</li> <li>То же с местоимениями-дополнениями: <span class="ex">Lo he visto</span>, <span class="ex">Se lo he dicho</span>.</li> <li>В отрицании <b>no</b> стоит перед всем блоком: <span class="ex">No me he levantado</span>, <span class="ex">No lo he hecho</span>.</li> <li>В вопросе подлежащее ставят после причастия или в начало: <span class="ex">¿Has comido ya?</span></li> </ul> </details> <details data-sec="use"><summary>Когда употребляется Perfecto</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>Значение</th><th>Пример</th></tr></thead><tbody> <tr><td>Действие в период, который ещё не закончился (hoy, esta semana, este año)</td><td class="ex">Hoy he comido poco.</td></tr> <tr><td>Недавнее прошлое с результатом сейчас</td><td class="ex">He perdido las llaves.</td></tr> <tr><td>Жизненный опыт (alguna vez, nunca, ya)</td><td class="ex">¿Has estado en México? Nunca he volado.</td></tr> <tr><td>Повторение до сих пор (muchas veces, varias veces)</td><td class="ex">Hemos visto esa película tres veces.</td></tr> <tr><td>Новость: сообщаем о только что случившемся</td><td class="ex">Han cerrado la calle.</td></tr> <tr><td>Незавершённое: todavía no, aún no</td><td class="ex">Todavía no he terminado.</td></tr> </tbody></table></div> <ul class="tight"> <li>Ключевая идея: Perfecto – это «прошедшее, связанное с настоящим». Если время закончилось (ayer, el año pasado, en 2010), нужен Indefinido.</li> <li><b>Испания:</b> Perfecto регулярно используют для сегодняшнего дня и недавнего прошлого: <span class="ex">Esta mañana he desayunado café</span>.</li> <li><b>Латинская Америка:</b> чаще используют Indefinido даже там, где в Испании был бы Perfecto: <span class="ex">Hoy desayuné café</span>. Perfecto есть, но реже.</li> <li>Для русскоязычных: формы обычного прошедшего («я прочитал») в испанском бывают двух типов – с Perfecto и с Indefinido. Выбирай по тому, закончен ли период времени.</li> </ul> </details> <details data-sec="markers"><summary>Маркеры времени</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>С Perfecto</th><th>С Indefinido</th></tr></thead><tbody> <tr><td>hoy, esta mañana, esta tarde, esta noche</td><td>ayer, anoche, anteayer</td></tr> <tr><td>esta semana, este mes, este año</td><td>la semana pasada, el mes pasado, el año pasado</td></tr> <tr><td>ya, todavía no, aún no, todavía</td><td>en 2010, hace dos años, aquel día</td></tr> <tr><td>nunca, jamás, alguna vez, siempre</td><td>una vez, entonces, de repente</td></tr> <tr><td>últimamente, recientemente, hasta ahora, desde entonces</td><td>durante, aquel verano</td></tr> <tr><td>muchas veces, varias veces</td><td>aquella noche</td></tr> </tbody></table></div> <p class="key">Если период времени ещё идёт (<b>hoy, esta semana</b>) – <b>Perfecto</b>. Если период закрыт (<b>ayer, la semana pasada</b>) – <b>Indefinido</b>.</p> <ul class="tight"> <li><span class="ex">Ya he leído el libro.</span> – «Уже прочитал».</li> <li><span class="ex">Todavía no he visto la película.</span> – «Ещё не смотрел».</li> <li><span class="ex">¿Alguna vez has comido paella?</span> – «Ты когда-нибудь ел паэлью?»</li> </ul> </details> <details data-sec="adj"><summary>Participio как прилагательное</summary> <p>Причастие может стоять не только после <b>haber</b>, но и как прилагательное. Тогда оно <b>согласуется в роде и числе</b> с существительным: -o / -a / -os / -as.</p> <div class="tblwrap"><table class="tbl"><thead><tr><th>haber + participio</th><th>estar + participio</th></tr></thead><tbody> <tr><td class="ex">He cerrado la puerta.<br><span class="muted small">cerrado не меняется</span></td><td class="ex">La puerta está cerrada.<br><span class="muted small">cerrada – женский род</span></td></tr> <tr><td class="ex">Hemos abierto las ventanas.</td><td class="ex">Las ventanas están abiertas.</td></tr> <tr><td class="ex">Han roto el vaso.</td><td class="ex">El vaso está roto.</td></tr> </tbody></table></div> <ul class="tight"> <li>После <b>haber</b> причастие неизменяемо: <span class="ex">Ella ha cantado</span>, <span class="ex">Ellos han cantado</span>.</li> <li>После <b>estar, ser, quedar</b> причастие – прилагательное и меняется: <span class="ex">Mis amigas están cansadas</span>.</li> <li><b>Estar + participio</b> – результат действия: «окно открыто». <b>Ser + participio</b> – пассивный залог: <span class="ex">La carta fue escrita ayer</span>.</li> </ul> </details> <details data-sec="voseo"><summary>Vos (Аргентина и др.)</summary> <p>В Perfecto форма <b>vos</b> не отличается от <b>tú</b>: <b>has</b> + participio. Особого окончания у vos здесь нет – в отличие от Presente.</p> <div class="mt-row"><div class="mt" data-conj="hablar" data-persons="tu,vos"></div><div class="mt" data-conj="hacer" data-persons="tu,vos"></div></div> <ul class="tight"> <li><span class="ex">Vos ya has terminado</span> = <span class="ex">Tú ya has terminado</span>.</li> <li>В Аргентине Perfecto используют редко, в быту чаще Indefinido: <span class="ex">¿Ya terminaste?</span></li> </ul> </details> <details data-sec="errors"><summary>Типичные ошибки</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>Неверно</th><th>Верно</th><th>Почему</th></tr></thead><tbody> <tr><td class="bad">he hacido</td><td class="good ex">he hecho</td><td>неправильное причастие</td></tr> <tr><td class="bad">he escribido</td><td class="good ex">he escrito</td><td>неправильное причастие</td></tr> <tr><td class="bad">he ponido</td><td class="good ex">he puesto</td><td>неправильное причастие</td></tr> <tr><td class="bad">he leido</td><td class="good ex">he leído</td><td>знак ударения: -eído</td></tr> <tr><td class="bad">he abrido</td><td class="good ex">he abierto</td><td>неправильное причастие</td></tr> <tr><td class="bad">tú has hablar</td><td class="good ex">tú has hablado</td><td>после haber – причастие, не инфинитив</td></tr> <tr><td class="bad">nosotros han comido</td><td class="good ex">nosotros hemos comido</td><td>haber согласуется с лицом</td></tr> <tr><td class="bad">ellos han cantados</td><td class="good ex">ellos han cantado</td><td>после haber причастие не меняется</td></tr> <tr><td class="bad">he me levantado</td><td class="good ex">me he levantado</td><td>местоимение перед haber</td></tr> <tr><td class="bad">tengo comido</td><td class="good ex">he comido</td><td>для времён используй haber</td></tr> <tr><td class="bad">ayer he comido</td><td class="good ex">ayer comí</td><td>ayer – закрытый период: Indefinido</td></tr> <tr><td class="bad">he hablo</td><td class="good ex">he hablado</td><td>нужно причастие, а не форма Presente</td></tr> </tbody></table></div> </details> </template> <template id="tpl-indefinido"> <details data-sec="intro"><summary>Обзор: что такое Indefinido</summary> <p><b>Pretérito indefinido</b> (он же <i>pretérito perfecto simple</i>) – простое прошедшее. Оно рассказывает о <b>законченном действии</b> в закрытом периоде: <span class="ex">Ayer comí paella</span>, <span class="ex">En 2018 viví en Madrid</span>.</p> <p class="key">Формула: <b>основа</b> + окончание. У -ar окончания <b>-é, -aste, -ó, -amos, -asteis, -aron</b>, у -er и -ir одинаковые: <b>-í, -iste, -ió, -imos, -isteis, -ieron</b>.</p> <div data-ptable="hablar,comer,vivir"></div> <p class="small muted">Синим выделены окончания, шафрановым – формы, которые отходят от правила. Знак ударения подчёркнут.</p> <ul class="tight"> <li>В формах <b>yo</b> и <b>él</b> ударение всегда на окончании: <b>hablé, habló, comí, comió</b>. Без знака это уже другое время: <span class="ex">hablo</span> (Presente) ≠ <span class="ex">habló</span> (Indefinido).</li> <li>Формы nosotros у -ar одинаковы в Presente и Indefinido: <b>hablamos</b>. Различает контекст: <span class="ex">Ayer hablamos</span>.</li> <li>Окончания <b>-er</b> и <b>-ir</b> совпадают полностью, в отличие от Presente.</li> <li>У <b>vos</b> в Indefinido нет особой формы: она такая же, как у tú.</li> </ul> </details> <details data-sec="reg"><summary>Окончания -ar и -er/-ir</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>-ar</th><th>-er / -ir</th></tr></thead><tbody> <tr><td>yo</td><td class="form"><span class="end">-é</span></td><td class="form"><span class="end">-í</span></td></tr> <tr><td>tú</td><td class="form"><span class="end">-aste</span></td><td class="form"><span class="end">-iste</span></td></tr> <tr><td>él / ella / usted</td><td class="form"><span class="end">-ó</span></td><td class="form"><span class="end">-ió</span></td></tr> <tr><td>nosotros</td><td class="form"><span class="end">-amos</span></td><td class="form"><span class="end">-imos</span></td></tr> <tr><td>vosotros</td><td class="form"><span class="end">-asteis</span></td><td class="form"><span class="end">-isteis</span></td></tr> <tr><td>ellos / ustedes</td><td class="form"><span class="end">-aron</span></td><td class="form"><span class="end">-ieron</span></td></tr> </tbody></table></div> <div class="mt-row"><div class="mt" data-conj="trabajar"></div><div class="mt" data-conj="aprender"></div><div class="mt" data-conj="escribir"></div></div> <ul class="tight"> <li>Корень у правильных глаголов <b>не меняется</b>. Глаголы с чередованием в Presente (<b>pensar, volver, encontrar</b>) в Indefinido правильные: <span class="ex">pensé, volví, encontré</span>.</li> <li>Глаголы на <b>-ger, -gir, -cer</b> тоже правильные: <span class="ex">cogí, dirigí, vencí</span>. Особая yo из Presente (cojo, venzo) здесь не нужна.</li> <li>Глаголы на <b>-iar, -uar</b> (enviar, continuar) правильные, ударение стоит на окончании: <span class="ex">envié, continuó</span>.</li> </ul> <p class="warn"><b>Ловушка:</b> <span class="bad">hablo</span> (Presente) и <span class="good">habló</span> (Indefinido); <span class="bad">comí</span> – это yo, <span class="good">comió</span> – это él.</p> </details> <details data-sec="spell"><summary>Орфография в yo (-qué, -gué, -cé)</summary> <p>Только в форме <b>yo</b> меняется написание: перед <b>-é</b> буква стоит так, чтобы звук остался прежним.</p> <div class="tblwrap"><table class="tbl"><thead><tr><th>Окончание</th><th>Замена</th><th>Пример</th></tr></thead><tbody> <tr><td>-car</td><td class="form"><span class="irr">c → qu</span></td><td class="ex">buscar → busqué, sacar → saqué, tocar → toqué</td></tr> <tr><td>-gar</td><td class="form"><span class="irr">g → gu</span></td><td class="ex">llegar → llegué, pagar → pagué, jugar → jugué</td></tr> <tr><td>-zar</td><td class="form"><span class="irr">z → c</span></td><td class="ex">empezar → empecé, almorzar → almorcé, cruzar → crucé</td></tr> <tr><td>-guar</td><td class="form"><span class="irr">gu → gü</span></td><td class="ex">averiguar → averigüé</td></tr> </tbody></table></div> <div data-ptable="llegar,buscar,empezar"></div> <ul class="tight"> <li>В остальных лицах написание обычное: <span class="ex">llegaste, llegó, buscaron, empezamos</span>.</li> <li>Причина простая: без замены <b>g</b> перед <b>é</b> читалось бы как [х], а <b>c</b> как [с / θ].</li> </ul> <p class="warn"><b>Ловушка:</b> <span class="bad">llegé</span> → <span class="good">llegué</span>, <span class="bad">busqé</span> → <span class="good">busqué</span>, <span class="bad">empezé</span> → <span class="good">empecé</span>.</p> </details> <details data-sec="boot"><summary>Чередование в 3-м лице (pidió, durmió)</summary> <p>Только у глаголов на <b>-ir</b>, которые в Presente меняют корень (e → ie, e → i, o → ue), в Indefinido корень меняется в <b>3-м лице</b> (<b>él</b> и <b>ellos</b>): <b>e → i</b> и <b>o → u</b>.</p> <div data-ptable="pedir,sentir,dormir,morir,seguir,elegir"></div> <ul class="tight"> <li><b>e → i:</b> pedir, repetir, servir, vestir, elegir, seguir, conseguir, medir, corregir, despedir, competir.</li> <li><b>e → i</b> (в Presente e → ie): sentir, preferir, mentir, sugerir, convertir, advertir, herir, referir.</li> <li><b>o → u:</b> dormir, morir.</li> <li>Глаголы на <b>-ar</b> и <b>-er</b> (pensar, volver, perder) здесь <b>не</b> меняются: <span class="ex">pensó</span>, <span class="ex">perdieron</span>.</li> <li>Остальные лица (yo, tú, nosotros, vosotros) используют обычный корень.</li> </ul> <p class="warn"><b>Ловушка:</b> <span class="bad">pedió</span> → <span class="good">pidió</span>, <span class="bad">dormieron</span> → <span class="good">durmieron</span>; <span class="bad">pidimos</span> → <span class="good">pedimos</span> (в nosotros корень не меняется).</p> </details> <details data-sec="y"><summary>Буква y и ударение (leyó, construyó)</summary> <p>Если окончание <b>-ió / -ieron</b> оказалось между двумя гласными, <b>i</b> превращается в <b>y</b>: <b>-yó, -yeron</b>.</p> <div data-ptable="leer,creer,caer,oír,construir,huir"></div> <ul class="tight"> <li>У глаголов на <b>-aer, -eer, -oír</b> (leer, creer, caer, oír) во всех остальных формах <b>i с ударением</b>: <b>leí, leíste, leímos, leísteis</b>.</li> <li>У глаголов на <b>-uir</b> (construir, huir, destruir, incluir, contribuir) знака нет, кроме <b>yo</b>: <b>construí</b>, но <b>construiste, construimos</b>.</li> <li>3-е лицо: <b>leyó, leyeron; oyó, oyeron; construyó, construyeron</b>.</li> <li><b>traer</b> и производные (atraer, distraer, contraer) – не здесь, а в особых основах: <b>trajo, trajeron</b>.</li> </ul> <p class="warn"><b>Ловушка:</b> <span class="bad">leió</span> → <span class="good">leyó</span>, <span class="bad">leieron</span> → <span class="good">leyeron</span>, <span class="bad">leiste</span> → <span class="good">leíste</span>.</p> </details> <details data-sec="stem"><summary>Особая основа</summary> <p>У ряда частых глаголов меняется <b>вся основа</b>, а окончания у всех одинаковые и <b>без знаков ударения</b>: <b>-e, -iste, -o, -imos, -isteis, -ieron</b>.</p> <div class="tblwrap"><table class="tbl"><thead><tr><th>Тип</th><th>Основа</th><th>Глаголы</th></tr></thead><tbody> <tr><td><b>u-основы</b></td><td class="form"><span class="irr">-uv-, -u-</span></td><td>estar → <b>estuv-</b>, andar → <b>anduv-</b>, tener → <b>tuv-</b>, poder → <b>pud-</b>, poner → <b>pus-</b>, saber → <b>sup-</b>, caber → <b>cup-</b></td></tr> <tr><td><b>i-основы</b></td><td class="form"><span class="irr">hic-, quis-, vin-</span></td><td>hacer → <b>hic-</b>, querer → <b>quis-</b>, venir → <b>vin-</b></td></tr> <tr><td><b>j-основы</b></td><td class="form"><span class="irr">-j-</span></td><td>decir → <b>dij-</b>, traer → <b>traj-</b>, conducir → <b>conduj-</b>, traducir → <b>traduj-</b>, producir → <b>produj-</b></td></tr> </tbody></table></div> <div data-ptable="tener,estar,poder,poner,saber,hacer,querer,venir,decir,traer,conducir"></div> <ul class="tight"> <li><b>hacer:</b> hice, hiciste, <b>hizo</b>: перед o вместо c пишут z.</li> <li><b>j-основы:</b> в 3-м лице мн. числа <b>-eron</b>, а не -ieron: <span class="ex">dijeron, trajeron, condujeron</span>.</li> <li>Приставочные глаголы идут так же: <b>mantener</b> → mantuve, <b>componer</b> → compuse, <b>convenir</b> → convine, <b>deshacer</b> → deshice, <b>predecir</b> → predije, <b>contraer</b> → contraje.</li> <li>В yo и él ударения нет: <b>tuve, tuvo, hice, dije, puso</b>. Это главное отличие от правильных (hablé, habló).</li> </ul> <p class="warn"><b>Ловушка:</b> <span class="bad">tenió</span> → <span class="good">tuvo</span>, <span class="bad">hací</span> → <span class="good">hice</span>, <span class="bad">dijieron</span> → <span class="good">dijeron</span>, <span class="bad">yo pudí</span> → <span class="good">yo pude</span>.</p> </details> <details data-sec="irr"><summary>ser, ir, dar, ver, reír</summary> <p><b>ser</b> и <b>ir</b> в Indefinido имеют одну и ту же форму. Нужный глагол определяют по смыслу.</p> <div data-ptable="ser,ir,dar,ver"></div> <ul class="tight"> <li><span class="ex">Fue al mercado</span> – ir («ходил»). <span class="ex">Fue un buen día</span> – ser («был»).</li> <li><b>dar</b> и <b>ver</b> получают окончания -er / -ir, но <b>без знаков ударения</b>: <b>di, diste, dio, vi, viste, vio</b> (в yo и él односложные формы без знака).</li> <li><b>reír, sonreír, freír:</b> reí, reíste, <b>rio</b>, reímos, reísteis, <b>rieron</b>. В 3-м лице один i исчезает.</li> </ul> <div data-ptable="reír,sonreír"></div> <p class="warn"><b>Ловушка:</b> <span class="bad">fuí</span> → <span class="good">fui</span>, <span class="bad">dió</span> → <span class="good">dio</span>, <span class="bad">vió</span> → <span class="good">vio</span>.</p> </details> <details data-sec="refl"><summary>Возвратные глаголы</summary> <p>Возвратное местоимение ставится <b>перед</b> глаголом, форма определяется по обычным правилам глагола.</p> <div class="mt-row"><div class="mt" data-conj="levantarse"></div><div class="mt" data-conj="dormirse"></div><div class="mt" data-conj="irse"></div></div> <ul class="tight"> <li><span class="ex">Me levanté a las siete.</span> <span class="ex">Se durmió en el sofá</span> (dormirse: o → u в 3-м лице).</li> <li><b>irse</b> – «уйти»: <span class="ex">Me fui. Se fueron.</span> Форма та же, что у ir.</li> <li>В отрицании <b>no</b> идёт перед местоимением: <span class="ex">No me levanté.</span></li> </ul> </details> <details data-sec="use"><summary>Когда употребляется Indefinido</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>Значение</th><th>Пример</th></tr></thead><tbody> <tr><td>Законченное действие в прошлом</td><td class="ex">Ayer compré un libro.</td></tr> <tr><td>Цепочка событий (одно за другим)</td><td class="ex">Llegué, abrí la puerta y entré.</td></tr> <tr><td>Точный срок или дата</td><td class="ex">Nació en 1990.</td></tr> <tr><td>Действие, у которого есть начало и конец</td><td class="ex">Viví en Madrid cinco años.</td></tr> <tr><td>Разовое действие</td><td class="ex">Una vez fui a México.</td></tr> <tr><td>Внезапное событие</td><td class="ex">De repente sonó el teléfono.</td></tr> <tr><td>Срок назад: hace + время</td><td class="ex">Llegó hace dos horas.</td></tr> </tbody></table></div> <ul class="tight"> <li>Идея: <b>закончено и закрыто</b>. С Indefinido действие «поставили точку», связи с настоящим нет.</li> <li>Сравни: <span class="ex">He comido</span> («поел, сегодня») и <span class="ex">Comí</span> («поел, вчера»).</li> <li>В Латинской Америке Indefinido используют и для сегодняшнего дня: <span class="ex">Hoy comí poco.</span></li> <li>Для описаний, привычек и фона в прошлом нужно другое время – Imperfecto (<span class="ex">hablaba</span>). Оно идёт следующим в курсе.</li> </ul> </details> <details data-sec="markers"><summary>Маркеры времени</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>С Indefinido</th><th>С Perfecto</th></tr></thead><tbody> <tr><td>ayer, anteayer, anoche</td><td>hoy, esta mañana, esta noche</td></tr> <tr><td>la semana pasada, el mes pasado, el año pasado</td><td>esta semana, este mes, este año</td></tr> <tr><td>en 2010, en julio, el lunes</td><td>ya, todavía no, aún no</td></tr> <tr><td>hace dos años, hace un rato</td><td>nunca, alguna vez, siempre</td></tr> <tr><td>de repente, entonces, una vez</td><td>últimamente, hasta ahora</td></tr> <tr><td>durante dos horas, aquel día</td><td>muchas veces (до сегодня)</td></tr> </tbody></table></div> <p class="key">Период <b>закончился</b> (ayer, el año pasado, en 2010) – <b>Indefinido</b>. Период <b>ещё идёт</b> (hoy, esta semana, este año) – <b>Perfecto</b>.</p> <ul class="tight"> <li><span class="ex">Ayer fui al médico.</span> – <span class="ex">Hoy he ido al médico.</span></li> <li><span class="ex">El año pasado viajé a Italia.</span> – <span class="ex">Este año he viajado a Italia.</span></li> </ul> </details> <details data-sec="voseo"><summary>Vos (Аргентина и др.)</summary> <p>В Indefinido <b>vos</b> использует форму <b>tú</b>: <span class="ex">vos hablaste, vos comiste, vos fuiste</span>. Особого окончания нет, в отличие от Presente (hablás).</p> <div class="mt-row"><div class="mt" data-conj="hablar" data-persons="tu,vos"></div><div class="mt" data-conj="hacer" data-persons="tu,vos"></div></div> <ul class="tight"> <li>В Аргентине Indefinido – главное разговорное прошедшее, Perfecto там редкий.</li> <li>Не путай с формой Presente vos: <b>hablás</b> (сейчас) и <b>hablaste</b> (вчера).</li> </ul> </details> <details data-sec="errors"><summary>Типичные ошибки</summary> <div class="tblwrap"><table class="tbl"><thead><tr><th>Неверно</th><th>Верно</th><th>Почему</th></tr></thead><tbody> <tr><td class="bad">yo hablo ayer</td><td class="good ex">yo hablé ayer</td><td>ayer: Indefinido, не Presente</td></tr> <tr><td class="bad">él hablo</td><td class="good ex">él habló</td><td>ударение на -ó</td></tr> <tr><td class="bad">yo llegé</td><td class="good ex">yo llegué</td><td>g → gu перед é</td></tr> <tr><td class="bad">yo empezé</td><td class="good ex">yo empecé</td><td>z → c перед é</td></tr> <tr><td class="bad">él pedió</td><td class="good ex">él pidió</td><td>e → i в 3-м лице</td></tr> <tr><td class="bad">él leió</td><td class="good ex">él leyó</td><td>i между гласными → y</td></tr> <tr><td class="bad">tú leiste</td><td class="good ex">tú leíste</td><td>знак ударения на í</td></tr> <tr><td class="bad">yo tení</td><td class="good ex">yo tuve</td><td>особая основа tuv-</td></tr> <tr><td class="bad">yo hací</td><td class="good ex">yo hice</td><td>особая основа hic-</td></tr> <tr><td class="bad">ellos dijieron</td><td class="good ex">ellos dijeron</td><td>после j окончание -eron</td></tr> <tr><td class="bad">yo pudí</td><td class="good ex">yo pude</td><td>у особых основ окончание -e</td></tr> <tr><td class="bad">yo fuí</td><td class="good ex">yo fui</td><td>fui без знака ударения</td></tr> <tr><td class="bad">él dió</td><td class="good ex">él dio</td><td>dio без знака ударения</td></tr> <tr><td class="bad">nosotros piensamos ayer</td><td class="good ex">nosotros pensamos ayer</td><td>корень не меняется у nosotros</td></tr> </tbody></table></div> </details> </template><script>window.__DATA={"verbs":[{"inf":"hablar","ru":"говорить","cat":"reg"},{"inf":"cantar","ru":"петь","cat":"reg"},{"inf":"comprar","ru":"покупать","cat":"reg"},{"inf":"trabajar","ru":"работать","cat":"reg"},{"inf":"estudiar","ru":"учить, изучать","cat":"reg"},{"inf":"escuchar","ru":"слушать","cat":"reg"},{"inf":"esperar","ru":"ждать","cat":"reg"},{"inf":"llamar","ru":"звонить, звать","cat":"reg"},{"inf":"mirar","ru":"смотреть","cat":"reg"},{"inf":"ayudar","ru":"помогать","cat":"reg"},{"inf":"cocinar","ru":"готовить (еду)","cat":"reg"},{"inf":"bailar","ru":"танцевать","cat":"reg"},{"inf":"limpiar","ru":"убирать, чистить","cat":"reg"},{"inf":"llevar","ru":"нести, носить","cat":"reg"},{"inf":"preparar","ru":"готовить","cat":"reg"},{"inf":"caminar","ru":"идти пешком","cat":"r вердительном императиве?","options":["Инфинитив: -r → -d (hablar → hablad)","Основа + -áis (habláis)","Форма vosotros в subjuntivo (habléis)","Форма tú + -s (hablas)"],"answer":["Инфинитив: -r → -d (hablar → hablad)"],"explain":"vosotros (+) всегда от инфинитива: hablad, comed, escribid. Исключений нет (ir → id).","scope":"vosotros"},{"id":"b-t004","type":"choice","topic":"Теория","label":"Теория","prompt":"Сколько основных глаголов имеют неправильную форму tú в утвердительном императиве?","options":["8","5","10","3"],"answer":["8"],"explain":"di, haz, ve, pon, sal, sé, ten, ven (decir, hacer, ir, poner, salir, ser, tener, venir)."},{"id":"b-t005","type":"choice","topic":"Теория","label":"Теория","prompt":"Imperativo afirmativo, tú, глагол hacer:","options":["haz","hace","haga","hagas"],"answer":["haz"],"explain":"hacer → haz. А в отрицании по общему правилу: no hagas."},{"id":"b-t006","type":"choice","topic":"Теория","label":"Теория","prompt":"Imperativo afirmativo, tú, глагол ir:","options":["ve","va","vaya","vé"],"answer":["ve"],"explain":"ir → ve (¡Ve a casa!). Отрицание: no vayas."},{"id":"b-t007","type":"choice","topic":"Теория","label":"Теория","prompt":"Imperativo afirmativo, tú, глагол ser:","options":["sé","es","sea","sed"],"answer":["sé"],"explain":"ser → sé (¡Sé amable!). Отрицание: no seas."},{"id":"b-t008","type":"choice","topic":"Теория","label":"Теория","prompt":"Где стоят местоимения в утвердительном императиве?","options":["Слитно после глагола (dímelo)","Перед глаголом отдельно (me lo di)","Через дефис (di-me-lo)","После глагола отдельными словами (di me lo)"],"answer":["Слитно после глагола (dímelo)"],"explain":"В утвердительном императиве местоимения присоединяются к глаголу в конце."},{"id":"b-t009","type":"choice","topic":"Теория","label":"Теория","prompt":"Где стоят местоимения в отрицательном императиве?","options":["Перед глаголом, после no (no me lo digas)","Слитно после глагола (no digasmelo)","Перед no (me lo no digas)","Всё равно, где"] "],"explain":"-car → -que, -gar → -gue, -zar → -ce."},{"id":"b-t016","type":"choice","topic":"Теория","label":"Теория","prompt":"Как правильно: no ___ (llegar, tú) tarde?","options":["llegues","llegees","llegües","llegas"],"answer":["llegues"],"explain":"g → gu перед e: llegar → llegue, no llegues."},{"id":"b-t017","type":"choice","topic":"Теория","label":"Теория","prompt":"Как правильно: no ___ (empezar, tú) tarde?","options":["empieces","empiezes","empecés","empeces"],"answer":["empieces"],"explain":"e → ie (корень) и z → c перед e."},{"id":"b-t018","type":"choice","topic":"Теория","label":"Теория","prompt":"Imperativo afirmativo, nosotros, глагол dormir:","options":["durmamos","dormamos","duermamos","dormemos"],"answer":["durmamos"],"explain":"В -ir глаголах в nosotros/vosotros subjuntivo o → u: durmamos, durmáis.","scope":"nosotros"},{"id":"b-t019","type":"choice","topic":"Теория","label":"Теория","prompt":"Есть ли чередование корня в nosotros/vosotros у глаголов -ar/-er (pensar, volver)?","options":["Нет: pensemos, volvamos","Да: piensemos, vuelvamos","Только в vosotros","Только в nosotros"],"answer":["Нет: pensemos, volvamos"],"explain":"У -ar/-er чередования в nosotros/vosotros нет. У -ir оно есть (e → i, o → u).","scope":"nosotros"},{"id":"b-t020","type":"choice","topic":"Теория","label":"Теория","prompt":"Возвратный глагол irse, vosotros (+):","options":["idos","iros","íos","id os"],"answer":["idos"],"explain":"Единственное исключение, где -d сохраняется: idos.","scope":"vosotros"},{"id":"b-s021","type":"input","topic":"Перевод","label":"Переведи на испанский","prompt":"Скажи мне правду. (tú)","answer":["Dime la verdad"],"explain":""},{"id":"b-s022","type":"input","topic":"Перевод","label":"Переведи на испанский","prompt":"Сделай это сейчас. (tú)","answer":["Hazlo ahora"],"explain":""},{"id":"b-s023","type":"input","topic":"Перевод","label":"Переведи на испанский","prompt":"Надень пальто. (tú)","answer":["Ponte el abrigo"],"explain":""},{"id":"b-s024","type as visto"],"hint":"ver – видеть","explain":"vos: форма haber такая же, как у tú: has. Неправильное причастие: ver → visto.","scope":"vos"},{"id":"f-f073","type":"input","topic":"Vos","label":"Подставь глагол в Perfecto","prompt":"Vos ___ muy bien hoy. (comer)","gloss":"Сегодня ты хорошо поел.","answer":["has comido"],"hint":"comer – есть","explain":"vos: форма haber такая же, как у tú: has. Причастие: com- + -ido = comido.","scope":"vos"},{"id":"f-u001","topic":"Употребление","type":"choice","label":"Значение Perfecto","prompt":"He estado en México.","gloss":"Что это значит?","answer":["Я бывал в Мексике (опыт)"],"options":["Я бывал в Мексике (опыт)","Я сейчас в Мексике","Я поеду в Мексику","Я жил в Мексике десять лет назад"],"explain":"Perfecto говорит об опыте: действие было в период, который связан с настоящим (вся жизнь)."},{"id":"f-u002","topic":"Употребление","type":"choice","label":"Значение Perfecto","prompt":"Hoy he comido pizza.","gloss":"Что это значит?","answer":["Сегодня я ел пиццу (день ещё не кончился)"],"options":["Сегодня я ел пиццу (день ещё не кончился)","Вчера я ел пиццу","Завтра я буду есть пиццу","Я ем пиццу прямо сейчас"],"explain":"Hoy, esta mañana, esta semana, este año – незаконченный период: в Испании ставят Perfecto."},{"id":"f-u003","topic":"Употребление","type":"choice","label":"Значение Perfecto","prompt":"¿Has visto mi móvil?","gloss":"Почему здесь Perfecto?","answer":["Результат важен сейчас: телефон нужен"],"options":["Результат важен сейчас: телефон нужен","Действие было давно","Это будущее","Это привычное действие"],"explain":"Perfecto связывает прошлое действие с настоящим: нам важен результат."},{"id":"f-u004","topic":"Употребление","type":"choice","label":"Что точнее?","prompt":"Я только что получил твоё сообщение.","gloss":"Выбери естественный вариант в Испании","answer":["Acabo de recibir tu mensaje"],"options":["Acabo de recibir tu mensaje","Recibir tu mensaje","Habías recibido tu mensaje","Ha recibir tu mensaje"],"explain":"acabar de + инфинитив – «только что». Это Presente: acabo de, acabas de…"},{"id":"f-u005","topic":"Употребление","type":"choice","label":"Верна ли форма?","prompt":"Ella ha abierto la puerta.","gloss":"Почему -o в abierto не меняется?","answer":["В Perfecto причастие не изменяется по роду и числу"],"options":["В Perfecto причастие не изменяется по роду и числу","Потому что puerta мужского рода","Это ошибка: надо abierta","Потому что ella единственное число"],"explain":"После haber причастие всегда в форме на -o: ha abierto, han abierto. Согласуется оно только как прилагательное: la puerta está abierta."},{"id":"f-u006","topic":"Употребление","type":"input","label":"Подставь глагол в Perfecto","prompt":"Yo ya ___ la cena. (preparar)","gloss":"Я уже приготовил ужин.","answer":["he preparado"],"hint":"preparar","explain":"ya + Perfecto: действие совершено, результат есть."},{"id":"f-u007","topic":"Употребление","type":"input","label":"Подставь глагол в Perfecto","prompt":"¿Alguna vez ___ tú paella? (probar)","gloss":"Ты когда-нибудь пробовал паэлью?","answer":["has probado"],"hint":"probar","explain":"alguna vez – «когда-нибудь»: вопрос об опыте, Perfecto."},{"id":"f-m001","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"hoy","gloss":"Какое время ставят в Испании с этим словом?","answer":["Pretérito perfecto"],"options":["Pretérito perfecto","Другое прошедшее (indefinido)"],"explain":"Hoy – день ещё идёт: Perfecto (hoy he comido)."},{"id":"f-m002","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"ayer","gloss":"Какое время ставят в Испании с этим словом?","answer":["Другое прошедшее (indefinido)"],"options":["Pretérito perfecto","Другое прошедшее (indefinido)"],"explain":"Ayer – закончившийся период: indefinido (ayer comí)."},{"id":"f-m003","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"esta semana","gloss":"Какое время ставят в Испании с этим словом?","answer":["Pretérito perfecto"],"options":["Pre definido)"],"explain":"Este año – период не закончился: Perfecto."},{"id":"f-m010","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"en 2010","gloss":"Какое время ставят в Испании с этим словом?","answer":["Другое прошедшее (indefinido)"],"options":["Pretérito perfecto","Другое прошедшее (indefinido)"],"explain":"Дата в прошлом: indefinido."},{"id":"f-m011","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"alguna vez","gloss":"Какое время ставят в Испании с этим словом?","answer":["Pretérito perfecto"],"options":["Pretérito perfecto","Другое прошедшее (indefinido)"],"explain":"Alguna vez – «когда-нибудь»: вопрос об опыте, Perfecto."},{"id":"f-m012","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"ya","gloss":"Какое время ставят в Испании с этим словом?","answer":["Pretérito perfecto"],"options":["Pretérito perfecto","Другое прошедшее (indefinido)"],"explain":"Ya («уже») обычно идёт с Perfecto: ya he terminado."},{"id":"f-m013","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"esta mañana","gloss":"Какое время ставят в Испании с этим словом?","answer":["Pretérito perfecto"],"options":["Pretérito perfecto","Другое прошедшее (indefinido)"],"explain":"Esta mañana, если сейчас ещё утро или утро только что закончилось: Perfecto."},{"id":"f-m014","topic":"Маркеры","type":"choice","label":"Perfecto или нет?","prompt":"la semana pasada","gloss":"Какое время ставят в Испании с этим словом?","answer":["Другое прошедшее (indefinido)"],"options":["Pretérito perfecto","Другое прошедшее (indefinido)"],"explain":"La semana pasada – закончившийся период: indefinido."},{"id":"f-a001","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"La puerta está ___ . (abrir)","gloss":"Дверь открыта.","answer":["abierta"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a002","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"Las ventanas están ___ . (cerrar)","gloss":"Окна закрыты.","answer":["cerradas"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a003","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"El restaurante está ___ . (cerrar)","gloss":"Ресторан закрыт.","answer":["cerrado"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a004","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"Los libros están ___ en la mesa. (poner)","gloss":"Книги лежат на столе.","answer":["puestos"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a005","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"Mi hermana está ___ . (cansar)","gloss":"Моя сестра устала.","answer":["cansada"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a006","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"Las cartas están ___ . (escribir)","gloss":"Письма написаны.","answer":["escritas"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a007","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"Los niños están ___ . (dormir)","gloss":"Дети спят.","answer":["dormidos"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a008","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"La tarea está ___ . (hacer)","gloss":"Задание сделано.","answer":["hecha"],"explain":"Participio как прилагательное согласуется с существительным в роде и числе."},{"id":"f-a009","type":"input","topic":"Participio-прилагательное","label":"Согласуй participio","prompt":"El problema est
